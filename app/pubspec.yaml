name: smart_poultry_farm
description: Smart Poultry Farm mobile app
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.5.0
  fl_chart: ^1.0.0
  http: ^1.2.1
  connectivity_plus: ^5.0.0
  flutter_secure_storage: ^9.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  firebase_database: ^12.0.0
  onesignal_flutter: ^5.6.8
  gotrue: ^2.0.0
  realtime_client: ^2.0.0
  flutter_dotenv: ^6.0.0
  iconsax: ^0.0.8
  wifi_iot: ^0.3.19
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/LP.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/LP.png
    - .env
